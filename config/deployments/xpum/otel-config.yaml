receivers:
  # The Intel XPU receiver.
  intel_xpu:
    # Metrics data collection interval.
    # Must be at least twice the sampling_interval.
    collection_interval: 5s
    # Initial start delay for metrics collection, any non positive value is assumed to be immediately.
    initial_delay: 1s
    # Metrics collection timeout.
    timeout: 0
    # Sampling interval for the high-frequency metrics.
    sampling_interval: 1s
    # Whether to fail collector startup if the L0 Sysman API cannot be
    # initialized (e.g. no GPU driver or device access). Defaults to false.
    fail_on_sysman_init_error: false
    # Collection of the GPU info logs, i.e. the CPER records provided by the GPU driver.
    # Enabled by the operator via ClusterPolicy spec.xpu.infoLogs, which also mounts the
    # host tracefs into the container.
    info_logs:
      # Whether the info logs are collected. Enabling requires elevated
      # privileges (for the CPER records, access to the kernel tracing filesystem).
      enabled: false
      # Name of the collection instance that the records are collected into
      # (a tracefs instance in the case of the CPER records).
      # Required, and must not contain '/'.
      instance_name: xpumd
    # Configuration for enabling/disabling individual metrics.
    # See receiver/intelxpu/sysman/documentation.md for list of available metrics.
    metrics:
#      hw.memory.size:
#        enabled: false

  # Enabled by the operator via ClusterPolicy spec.xpu.crashLog, which also mounts the
  # host directory and adds the receiver to the logs pipeline. Dropped otherwise.
  intel_crashlog:
    # Directory to watch for new crashlog files (must exist!).
    directory: /var/log/crashlog
    # Filename glob pattern (matched against the base name of each file).
    glob: "*.crashlog"
    # Ignore files whose modification time is older than this duration before
    # startup. Zero means only files created after startup are processed.
    ignore_older_than: 0s

processors:
  intel_xpu_status:
    rules:
      - name: "Intel GPU core temperature health"
        source_metric: "hw.temperature"
        parent_metric: "hw.gpu.info"
        parent_ref_attribute: "hw.id"
        parent_filters:
          - key: "pci.vendor_id"
            values: ["8086"]
        component_filters:
          - key: "hw.sensor_location"
            values: ["gpu"]
        copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
        add_attributes:
          hw.type: "temperature"
        # Ordered list of state rules. The rules should be ordered by increasing severity.
        # All rules are evaluated, the last matching one will be active.
        states:
          # Default state
          - state_name: "ok"
          - state_name: "critical"
            conditions:
              - value: 100.0
      - name: "Intel GPU memory temperature health"
        source_metric: "hw.temperature"
        parent_metric: "hw.gpu.info"
        parent_ref_attribute: "hw.id"
        parent_filters:
          - key: "pci.vendor_id"
            values: ["8086"]
        component_filters:
          - key: "hw.sensor_location"
            values: ["memory"]
        copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
        add_attributes:
          hw.type: "temperature"
        # Ordered list of state rules. The rules should be ordered by increasing severity.
        # All rules are evaluated, the last matching one will be active.
        states:
          # Default state
          - state_name: "ok"
          - state_name: "critical"
            conditions:
              - value: 100.0

exporters:
  intel_xpu_info:
    endpoint: "/run/xpumd/intel_xpu_info.sock"
    hw_status_mappings:
      # A wedged GPU and a card that has fallen into survivability (FDO) mode are both
      # unusable, so report them as "failed" under their own health domains. Together with
      # the "health-xpumd-" prefix the DRA driver adds, these become the
      # health-xpumd-gpu.wedged / health-xpumd-gpu.survivability device taints.
      #
      # This has to come first: the mappings are first-match-wins (that is what makes the
      # ecc filter-out entry below work), and the trailing "{{ .hw_type }}" rule carries no
      # filters, so it matches every GPU state and would fold these two into its
      # '"*": warning' bucket instead.
      - health_domain: "gpu.{{ .hw_state }}"
        filters:
          - key: hw.type
            values: [gpu]
          - key: hw.state
            values: [wedged, survivability]
        state_mapping:
          wedged:
            severity: failed
          survivability:
            severity: failed
      - health_domain: "memory"
        filters:
          - key: hw.type
            values: [memory]
        state_mapping:
          unknown:
            severity: unknown
          ok:
            severity: ok
          degraded:
            severity: warning
          critical:
            severity: critical
          replace:
            severity: critical
          "*":
            severity: warning
            message: "Unexpected memory health state, mapped to warning"
      # Filter out (by using empty state_mapping) ECC states that are not indicative of device health
      - health_domain: "gpu"
        filters:
          - key: hw.type
            values: [gpu]
          - key: hw.state
            values: [ecc_disabled, ecc_enabled, ecc_available, ecc_unavailable]
        state_mapping: {}
      - health_domain: "{{ .hw_type }}"
        state_mapping:
          unknown:
            severity: unknown
          ok:
            severity: ok
          warning:
            severity: warning
          critical:
            severity: critical
          failed:
            severity: failed
          "*":
            severity: warning
  prometheus:
    endpoint: "0.0.0.0:8080"

extensions:

service:
  telemetry:
    logs:
      level: info
      disable_stacktrace: true
  pipelines:
    metrics:
      receivers: [intel_xpu]
      processors: [intel_xpu_status]
      exporters: [intel_xpu_info,prometheus]
    logs:
      # "intel_crashlog" is added by the operator when crashlog collection is enabled
      receivers: [intel_xpu]
      exporters: [intel_xpu_info]
