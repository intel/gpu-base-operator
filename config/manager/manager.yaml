apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: intel-gpu-base-operator
    app.kubernetes.io/managed-by: kustomize
    resource.kubernetes.io/admin-access: "true"
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: intel-gpu-base-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: intel-gpu-base-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: intel-gpu-base-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      # The operator must tolerate the taints it applies itself, because it is the only thing
      # that removes them. A GPURecoveryPlan reset cordons the node it is recovering; if that
      # reset wedges the host and the operator pod is later evicted, its replacement has to be
      # schedulable somewhere. On a single-node cluster — or one where every other node is full
      # or tainted — the only candidate is the cordoned node itself, and without this toleration
      # the operator can never come back to lift its own taint.
      #
      # NoSchedule only: the drain deliberately never evicts the operator's own namespace, so
      # this covers scheduling a *replacement* pod rather than protecting the running one.
      #
      # GPUFirmwareUpdate's taint key comes from spec.updateTaint and has no fixed value, so it
      # cannot be listed here; add a toleration for it when using that CRD.
      tolerations:
      - key: gpurecoveryplan.intel.com/recovery
        operator: Exists
        effect: NoSchedule
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        env:
          - name: OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: MODULE_LOADER_SERVICE_ACCOUNT_NAME
            # kustomize prepends the namePrefix (intel-gpu-base-operator-) to the
            # ServiceAccount, but not to this literal, so set the resolved name here.
            value: intel-gpu-base-operator-module-loader
        image: ghcr.io/intel/intel-gpu-base-operator:devel
        imagePullPolicy: IfNotPresent
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 200m
            memory: 386Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
