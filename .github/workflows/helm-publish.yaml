name: Package and upload helm

on:
  workflow_dispatch:
    inputs:
      runner:
        default: "self-hosted"
        required: false
        type: string

permissions: {}

env:
  REGISTRY: ${{ vars.REGISTRY }}
  PROJECT: ${{ vars.PROJECT }}
  # Used by the Makefile
  RELEASE_REGISTRY: ${{ vars.REGISTRY }}/${{ vars.PROJECT }}

jobs:
  push-helm-charts:
    runs-on: ${{ inputs.runner }}
    permissions:
      packages: write
      contents: read

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-tags: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to the Container registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        if: inputs.runner != 'self-hosted'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push packaged Helm chart
        run: make helm-push-chart

      - name: Push packaged Helm policy chart
        run: make helm-push-policy-chart