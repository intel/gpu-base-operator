policyName: intel-gpu-policy
resourceRegistration: dp
useNFDLabeling: false
resourceMonitoring: true
prometheusIntegration: false
enableKueue: false

logLevel: 1

health:
  coreTemperatureThreshold: 88
  memoryTemperatureThreshold: 99
  checkIntervalSeconds: 12

dp:
  plugin: docker.io/intel/intel-gpu-plugin:0.37.0@sha256:7001200071db10587fc31184eedda4f5cf291efba737adf85a8c80539f7fa5e1
  logLevel: 2
  byPathMode: single
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: gpu.intel.com/dp-deny-node
#           operator: DoesNotExist

dra:
  image: ghcr.io/intel/intel-gpu-resource-driver:v0.12.1@sha256:1479956240397c7207c3d38c0d296bd591cd66f26d432452f9a2d75336843776
  logLevel: 2
  podHealthCheck: true
  manageBinding: false
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: gpu.intel.com/dra-deny-node
#           operator: DoesNotExist

xpu:
  image: ghcr.io/intel/xpumanager/xpumd:v2.3.0@sha256:539009b75c64159ca2202f52b94ae736ab3883c3497d30d65bd3d179357e1859
  logLevel: 2
  monitoringResource: monitoring
  configMapOverride: ""
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: gpu.intel.com/xpumd-deny-node
#           operator: DoesNotExist
  # Restart a node's XPU Manager pod so it can monitor a GPU its container cannot reach.
  restartOnDeviceRecovery: OnRecoveredDevice
  # Collect GPU info logs (CPER records via tracefs) and crash logs (/var/log/crashlog).
  # Both depend on kernel and xe KMD support.
  infoLogs: false
  crashLog: false
  # Export metrics and logs also to an OTLP gateway. Set exactly one of http or grpc.
  # Secrets and ConfigMaps referenced here have to be in the operator namespace.
# otlp:
#   grpc:
#     endpoint: https://otel-gateway.example.com:4317
#     headers:
#     - name: Authorization
#       valueFrom:
#         name: otlp-auth   # Secret key holding the full value, e.g. "Bearer <token>"
#         key: token
#     tls:
#       ca:                 # For a private or self-signed gateway CA
#         name: otlp-gateway-ca
#         key: ca.crt
#       clientCertSecret:   # kubernetes.io/tls Secret for mutual TLS
#         name: otlp-client-cert

kueue:
  equalResources:
    - name: gpu-cluster-queue
      localQueues:
      - name: gpu-queue
        namespace: default

# kernelModule:
#   moduleName: xe
#   # To upgrade the driver, just change the containerImage below; KMM rolls it
#   # out to all selected nodes at once (brief GPU-workload disruption). Only set
#   # `version` if you want KMM's node-by-node ordered upgrade, which requires you
#   # to label each node with
#   # kmm.node.kubernetes.io/version-module.<namespace>.<module>=<version> before
#   # the driver loads there. See https://kmm.sigs.k8s.io/documentation/ordered_upgrade
#   # version: "1.0"
#   kernelMappings:
#   - regexp: "^.+$"
#     containerImage: registry.example.com/xe-driver:1.0
#
#   # Multi-kernel support:
#   # kernelMappings:
#   # - regexp: "^5\\.14\\.0-.*\\.el9.*\\.x86_64$"
#   #   containerImage: registry.example.com/xe-driver-rhel9:1.0
#   # - regexp: "^6\\.12\\..*"
#   #   containerImage: registry.example.com/xe-driver-rhel10:1.0
#   #
#   # In-cluster build:
#   # kernelMappings:
#   # - regexp: "^5\\.14\\..*"
#   #   build:
#   #     dockerfileConfigMap:
#   #       name: xe-dockerfile
#   #     buildArgs:
#   #     - name: XE_TAG
#   #       value: v1.0
#   #
#   # Per-mapping extra in-tree modules to remove (moduleName is always included automatically):
#   # - regexp: "^5\\.14\\..*"
#   #   containerImage: registry.example.com/xe:1.0
#   #   inTreeModulesToRemove: ["i915"]
#   #
#   # modulesLoadingOrder: ["xe", "drm_buddy", "drm_ttm_helper"]
#   # firmwarePath: /opt/lib/firmware/xe
#   # registryTLS:
#   #   insecure: false
#   #   insecureSkipTLSVerify: false

pullSecret: null
nodeSelector: {}
tolerations: []
