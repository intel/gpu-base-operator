apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controller-manager
  labels:
    control-plane: {{ .Release.Name }}-controller-manager
    app.kubernetes.io/name: intel-gpu-base-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: {{ .Release.Name }}-controller-manager
      app.kubernetes.io/name: intel-gpu-base-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: {{ .Release.Name }}-controller-manager
        app.kubernetes.io/name: intel-gpu-base-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      # The operator must tolerate the taints it applies itself, because it is the only thing
      # that removes them. A GPURecoveryPlan reset cordons the node it is recovering; if that
      # reset wedges the host and the operator pod is later evicted, its replacement has to be
      # schedulable somewhere. On a single-node cluster — or one where every other node is full
      # or tainted — the only candidate is the cordoned node itself, and without this toleration
      # the operator can never come back to lift its own taint.
      #
      # NoSchedule only: the drain deliberately never evicts the operator's own namespace, so
      # this covers scheduling a *replacement* pod rather than protecting the running one.
      #
      # GPUFirmwareUpdate's taint key comes from spec.updateTaint and has no fixed value, so it
      # cannot be listed here — add it via operator.tolerations when using that CRD.
      tolerations:
      - key: gpurecoveryplan.intel.com/recovery
        operator: Exists
        effect: NoSchedule
      {{- with .Values.operator.tolerations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.privateRegistry.token }}
      imagePullSecrets:
      - name: {{ .Release.Name }}-operator-private-registry
      {{- end }}
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          - -v={{ .Values.operator.verbosity }}
        {{- if .Values.metrics.enabled }}
          # Without this flag --metrics-bind-address defaults to "0", which disables the
          # endpoint entirely. The kustomize path sets it via config/default/manager_metrics_patch.yaml.
          - --metrics-bind-address=:{{ .Values.metrics.port }}
          - --metrics-secure={{ .Values.metrics.secure }}
        {{- end }}
        env:
          - name: OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: MODULE_LOADER_SERVICE_ACCOUNT_NAME
            value: "{{ .Values.moduleLoader.serviceAccountName }}"
      {{- if .Values.privateRegistry.token }}
          - name: OPERATOR_SECRET
            value: "{{ .Release.Name }}-operator-private-registry"
      {{- end }}
        image: "{{ .Values.operator.image.repository }}"
        imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-certs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: {{ .Values.operator.resources.limits.cpu | default "500m" }}
            memory: {{ .Values.operator.resources.limits.memory | default "128Mi" }}
          requests:
            cpu: {{ .Values.operator.resources.requests.cpu | default "10m" }}
            memory: {{ .Values.operator.resources.requests.memory | default "64Mi" }}
      serviceAccountName: {{ .Release.Name }}-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: webhook-certs
        secret:
          secretName: webhook-server-cert

