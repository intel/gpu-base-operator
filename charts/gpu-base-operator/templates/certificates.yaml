---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: intel-gpu-base-operator
  name: intel-gpu-base-operator-metrics-certs
  namespace: {{ .Release.Namespace }}
spec:
  # config/certmanager/certificate-metrics.yaml carries SERVICE_NAME/SERVICE_NAMESPACE placeholders
  # that kustomize substitutes; Helm does not, so they must be spelled out here against the metrics
  # Service in metrics_service.yaml.
  #
  # NOTE: the manager does not mount this secret and is not started with --metrics-cert-path, so it
  # still serves the self-signed cert it generates at startup and this Certificate goes unused. See
  # config/default/cert_metrics_manager_patch.yaml for the mount the chart is missing.
  dnsNames:
  - {{ .Release.Name }}-controller-manager-metrics-service.{{ .Release.Namespace }}.svc
  - {{ .Release.Name }}-controller-manager-metrics-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: intel-gpu-base-operator-selfsigned-issuer
  secretName: metrics-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: intel-gpu-base-operator
  name: intel-gpu-base-operator-serving-cert
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
  - intel-gpu-base-operator-webhook-service.{{ .Release.Namespace }}.svc
  - intel-gpu-base-operator-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: intel-gpu-base-operator-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: intel-gpu-base-operator
  name: intel-gpu-base-operator-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
