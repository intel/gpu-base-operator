{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.metrics.enabled }}
{{- fail "metrics.serviceMonitor.enabled requires metrics.enabled: a ServiceMonitor scraping a disabled endpoint would report the operator as permanently down" }}
{{- end }}
# Scrapes the operator's own metrics endpoint. Opt-in, because it needs the Prometheus
# Operator CRDs installed: applying a ServiceMonitor without monitoring.coreos.com present
# fails the whole `helm install` on an unknown kind.
#
# Distinct from the ServiceMonitor the operator *deploys for XPU-Manager* (see
# config/deployments/prometheus/service-monitor.yaml and MiscReconciler) — that one exports GPU
# telemetry, this one exports the operator's own controller metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-controller-manager-metrics-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: {{ .Release.Name }}-controller-manager
    app.kubernetes.io/name: intel-gpu-base-operator
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      control-plane: {{ .Release.Name }}-controller-manager
      app.kubernetes.io/name: intel-gpu-base-operator
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  endpoints:
  - path: /metrics
    port: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    scheme: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    {{- with .Values.metrics.serviceMonitor.interval }}
    interval: {{ . }}
    {{- end }}
    {{- if .Values.metrics.secure }}
    # The endpoint is protected by authn/authz filters (see cmd/main.go), so the scraper must
    # present a token. The RBAC allowing it is in metrics_reader_role.yaml — bind Prometheus's
    # ServiceAccount to that ClusterRole or scrapes come back 401.
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      {{- if .Values.metrics.serviceMonitor.tlsConfig }}
      {{- toYaml .Values.metrics.serviceMonitor.tlsConfig | nindent 6 }}
      {{- else }}
      # The manager serves a self-signed cert generated at startup, not one from cert-manager,
      # so there is no CA for Prometheus to verify against and this must be skipped by default.
      # To verify properly, mount a cert-manager cert into the manager, point
      # --metrics-cert-path at it, and set metrics.serviceMonitor.tlsConfig here.
      insecureSkipVerify: true
      {{- end }}
    {{- end }}
{{- end }}
