# Default values for gpu-base-operator.

createNamespace: true

nfd:
  install: false
  postDeleteCleanup: false

operator:
  image:
    repository: ghcr.io/intel/intel-gpu-base-operator:devel
    pullPolicy: IfNotPresent
  verbosity: 2
  resources:
    limits:
      cpu: 200m
      memory: 386Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Extra tolerations for the operator pod, on top of the built-in one for the recovery taint
  # it applies itself. Set this when using GPUFirmwareUpdate, whose taint key is whatever
  # spec.updateTaint says and so cannot be tolerated by default:
  #   - key: gpu-update-in-progress
  #     operator: Exists
  #     effect: NoSchedule
  tolerations: []

# Default operand images, passed to the operator as RELATED_IMAGE_* env vars. Point these at
# a mirror registry for disconnected installs. Keep digest-pinned and in sync with the
# Default*Image constants in api/v1alpha1/clusterpolicy_webhook.go and config/manager/manager.yaml.
operandImages:
  devicePlugin: docker.io/intel/intel-gpu-plugin:0.37.0@sha256:7001200071db10587fc31184eedda4f5cf291efba737adf85a8c80539f7fa5e1
  dra: ghcr.io/intel/intel-gpu-resource-driver:v0.12.1@sha256:1479956240397c7207c3d38c0d296bd591cd66f26d432452f9a2d75336843776
  xpuManager: ghcr.io/intel/xpumanager/xpumd:v2.3.0@sha256:539009b75c64159ca2202f52b94ae736ab3883c3497d30d65bd3d179357e1859

metrics:
  # Serve the operator's own metrics (the controller-runtime and workqueue metrics).
  enabled: false
  port: 8443
  # Protect the endpoint with TLS and the authn/authz filter. When true, a scraper must present
  # a bearer token and hold the <release>-metrics-reader ClusterRole.
  secure: true
  serviceMonitor:
    # Off by default: a ServiceMonitor requires the Prometheus Operator CRDs, and applying one
    # without monitoring.coreos.com installed fails the whole helm install on an unknown kind.
    # Turn this on only when Prometheus Operator is present.
    enabled: false
    # Scrape interval. Empty means inherit the Prometheus default.
    interval: ""
    # Extra labels, for a Prometheus whose serviceMonitorSelector requires a specific label
    # (e.g. release: kube-prometheus-stack) to pick the monitor up.
    additionalLabels: {}
    # Replaces the default insecureSkipVerify when metrics.secure is true. Set this only after
    # pointing the manager's --metrics-cert-path at a real cert; see the template for details.
    tlsConfig: {}

privateRegistry:
  url: ""
  user: ""
  token: ""

kueue:
  install: false
  managerConfig:
    # -- controller_manager_config.yaml.
    # ControllerManager utilizes this yaml via manager-config Configmap.
    # @default -- controllerManagerConfigYaml
    #
    # Original Kueue v0.19 managerConfig from
    # https://github.com/kubernetes-sigs/kueue/blob/main/charts/kueue/values.yaml#L113
    controllerManagerConfigYaml: |-
      apiVersion: config.kueue.x-k8s.io/v1beta2
      kind: Configuration
      health:
        healthProbeBindAddress: :8081
      metrics:
        bindAddress: :8443
      webhook:
        port: 9443
      leaderElection:
        leaderElect: true
        resourceName: c1f6bfd2.kueue.x-k8s.io
      controller:
        groupKindConcurrency:
          Job.batch: 5
          Pod: 5
          Workload.kueue.x-k8s.io: 10
          LocalQueue.kueue.x-k8s.io: 5
          ClusterQueue.kueue.x-k8s.io: 5
          ResourceFlavor.kueue.x-k8s.io: 1
      clientConnection:
        qps: 300
        burst: 500
      integrations:
        frameworks:
        - "batch/job"
        - "kubeflow.org/mpijob"
        - "ray.io/rayjob"
        - "ray.io/rayservice"
        - "ray.io/raycluster"
        - "jobset.x-k8s.io/jobset"
        - "trainer.kubeflow.org/trainjob"
        - "workload.codeflare.dev/appwrapper"
        - "pod"
        - "deployment"
        - "statefulset"
        - "leaderworkerset.x-k8s.io/leaderworkerset"
      # deviceClassMappings set by https://github.com/intel/gpu-base-operator
      resources:
        deviceClassMappings:
        - deviceClassNames:
          - "gpu.intel.com"
          name: "dra.gpu.intel.com"

openshift:
  enabled: false

moduleLoader:
  create: true
  serviceAccountName: module-loader
